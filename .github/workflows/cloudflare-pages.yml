name: Publicar no Cloudflare Pages

# A cada push na main: testes → monta dist/ (só o site público) → publica no projeto "drysul" do Cloudflare Pages.
# Fica desligado (pulado, sem erro) até a conta ser ligada: variável CF_PAGES_ATIVO (true/verdadeiro/sim) e os segredos
# CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID no repositório (Settings → Secrets and variables → Actions).
# O GitHub Pages continua publicando em paralelo (pages.yml).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  publicar:
    # qualquer valor de "ligado" (o tradutor do navegador pode trocar true por verdadeiro); vazio ou false/falso/não desliga
    if: ${{ vars.CF_PAGES_ATIVO != '' && !contains(fromJSON('["false","falso","nao","não","0","off"]'), vars.CF_PAGES_ATIVO) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes
        run: npm test
      - name: Montar dist/
        run: node scripts/build-pages.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      # Publica de uma pasta fora do repositório: o wrangler.jsonc da raiz é do Worker; o do Pages é gerado lá,
      # com o padrão seguro (produção bloqueada, sem banco = pagamento online desligado).
      - name: Preparar publicação (site + /api e /admin)
        run: node scripts/preparar-deploy-pages.mjs "$RUNNER_TEMP/pages"
        env:
          DRYSUL_AMBIENTE: ${{ vars.DRYSUL_AMBIENTE }}
          PAGAMENTOS_ATIVOS: ${{ vars.PAGAMENTOS_ATIVOS }}
          SITE_URL: ${{ vars.SITE_URL }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          RETENCAO_DIAS_NAO_PAGOS: ${{ vars.RETENCAO_DIAS_NAO_PAGOS }}
          D1_ID: ${{ vars.D1_ID }}
      - name: Publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_ID: ${{ vars.D1_ID }}
        run: |
          cd "$RUNNER_TEMP/pages"
          npx --yes wrangler@4.151.1 pages project create drysul --production-branch main || true
          # com banco configurado, aplica as migrações antes de publicar (o token precisa de "D1: Editar")
          if [ -n "$D1_ID" ]; then npx --yes wrangler@4.151.1 d1 migrations apply DB --remote; fi
          npx --yes wrangler@4.151.1 pages deploy --project-name drysul --branch main --commit-dirty=true

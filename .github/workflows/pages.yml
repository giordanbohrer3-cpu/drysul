name: Publicar no GitHub Pages

# O Pages deste repositório publica a branch gh-pages.
# A cada push na main, os testes rodam e, se passarem, a gh-pages recebe o mesmo commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Testes (calculadora e central de vendas)
        run: node --test tests/calculator.test.js tests/checkout.test.js
      - name: Atualizar a branch gh-pages
        run: git push origin HEAD:refs/heads/gh-pages
      # o push costuma disparar o build do Pages sozinho, mas nem sempre: o pedido explícito garante a publicação
      - name: Pedir o build do Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pedido de build recusado; o push acima ainda pode disparar a publicação."

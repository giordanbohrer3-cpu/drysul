name: Publicar no GitHub Pages

# O Pages deste repositório usa a fonte "GitHub Actions": a cada push na main,
# os testes rodam e, se passarem, o site é enviado direto para o Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Node 22: os testes do servidor usam node:sqlite (banco D1 em memória)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes (calculadora, busca, central de vendas e servidor de pagamentos)
        run: npm test
      - uses: actions/configure-pages@v5
      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
